<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SpaceBook</title>
</head>
<body>
    <div class="mainHeader"><h1>SpaceBook</h1></div>
    <div class="authorizeDiv">
        <div class="autComponents">
            <h1 class="sbHeader">SpaceBook</h1>
            <label for="username">User ID :</label>
            <input type="text" id="username">
            <br>
            <br>
            <label for="password">Password :</label>
            <input type="password" id="password">
            <br>
            <p><input type="checkbox" id="showPass">Show Password ?</p>
            <button>Login</button>
            <br>
            <p style="user-select: none;">Don`t have an account? <u style="cursor: pointer;">Sign in</u></p>
            <p>Or Sign in with :</p>
            <br>
            <div class="autButtons">
                <button class="button A">A</button>
                <button class="button B">B</button>
                <button class="button B">C</button>
            </div>
        </div>
    </div>
</body>
</html>
